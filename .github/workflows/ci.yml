name: CI/CD to AWS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_BACKEND_REPOSITORY: pricepulse-backend
  ECR_FRONTEND_REPOSITORY: pricepulse-frontend

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    env:
      SECRET_KEY: a_test_secret_key_that_is_long_enough
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      DATABASE_URL: "sqlite:///:memory:"
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: pytest

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build             -t "$ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG"             -t "$ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:latest"             ./backend
          docker push "$ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:latest"

      - name: Build and push frontend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          docker build             --build-arg VITE_API_URL="$VITE_API_URL"             -t "$ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG"             -t "$ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:latest"             ./frontend
          docker push "$ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:latest"

      - name: Deploy backend through SSM
        env:
          INSTANCE_ID: ${{ vars.BACKEND_INSTANCE_ID }}
          IMAGE_TAG: ${{ github.sha }}
          ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          COMMAND_ID=$(aws ssm send-command             --instance-ids "$INSTANCE_ID"             --document-name "AWS-RunShellScript"             --comment "Deploy PricePulse backend $IMAGE_TAG"             --parameters commands="[
              \"set -e\",
              \"aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com\",
              \"docker pull $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG\",
              \"docker rm -f pricepulse-backend || true\",
              \"docker run -d --name pricepulse-backend --restart unless-stopped --env-file /opt/pricepulse/backend.env -p 8000:8000 $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG\",
              \"sleep 5\",
              \"curl -fsS http://127.0.0.1:8000/\"
            ]"             --query "Command.CommandId"             --output text)

          aws ssm wait command-executed             --command-id "$COMMAND_ID"             --instance-id "$INSTANCE_ID"

          aws ssm get-command-invocation             --command-id "$COMMAND_ID"             --instance-id "$INSTANCE_ID"             --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'

      - name: Deploy frontend through SSM
        env:
          INSTANCE_ID: ${{ vars.FRONTEND_INSTANCE_ID }}
          IMAGE_TAG: ${{ github.sha }}
          ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          COMMAND_ID=$(aws ssm send-command             --instance-ids "$INSTANCE_ID"             --document-name "AWS-RunShellScript"             --comment "Deploy PricePulse frontend $IMAGE_TAG"             --parameters commands="[
              \"set -e\",
              \"aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com\",
              \"docker pull $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG\",
              \"docker rm -f pricepulse-frontend || true\",
              \"docker run -d --name pricepulse-frontend --restart unless-stopped -p 80:80 -p 443:443 -v /etc/letsencrypt:/etc/letsencrypt:ro -v /var/www/certbot:/var/www/certbot $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG\",
              \"sleep 5\",
              \"curl -fsS http://127.0.0.1/healthz\"
            ]"             --query "Command.CommandId"             --output text)

          aws ssm wait command-executed             --command-id "$COMMAND_ID"             --instance-id "$INSTANCE_ID"

          aws ssm get-command-invocation             --command-id "$COMMAND_ID"             --instance-id "$INSTANCE_ID"             --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'
